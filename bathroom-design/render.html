<title>Unit 18D Bathroom 3D</title>
<meta name="description" content="Interactive 3D render of the proposed Unit 18D bathroom.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Barlow+Condensed:wght@500;600&family=Public+Sans:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #111612;
    --ink: #eef0e8;
    --muted: #b3bcb0;
    --chip: rgba(20, 27, 22, 0.72);
    --chip-on: #cfb27a;
    --chip-on-ink: #1b1a14;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Public Sans", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  .top {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px;
    display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between;
    background: linear-gradient(rgba(10, 14, 11, 0.75), rgba(10, 14, 11, 0));
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  #ui-toggle {
    position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); z-index: 5;
    font: 600 13px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 1px; text-transform: uppercase;
    color: var(--chip-on-ink); background: var(--chip-on); border: 0; border-radius: 999px;
    padding: 11px 16px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  #ui-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  body.clean .top, body.clean .hint { display: none; }
  body.clean #ui-toggle { opacity: .75; }
  h1 { font-family: "Gloock", Georgia, serif; font-weight: 400; font-size: 22px; margin: 0; line-height: 1.1; }
  h1 small { display: block; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .views { display: flex; flex-wrap: wrap; gap: 6px; }
  .top .controls { display: grid; gap: 6px; justify-items: end; }
  .views button {
    font: 600 13px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 1px; text-transform: uppercase;
    color: var(--ink); background: var(--chip); border: 1px solid rgba(255, 255, 255, 0.18);
    padding: 9px 12px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(6px);
  }
  .views button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  .views button:focus-visible { outline: 2px solid var(--chip-on); outline-offset: 2px; }
  .hint {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    font-size: 12px; color: var(--muted); text-shadow: 0 1px 2px #000; pointer-events: none;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .lens { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(24,16,8,0.38) 100%); }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: 0.09; mix-blend-mode: overlay; background-size: 220px 220px; }
  #err[hidden] { display: none; }
  #err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 600px) {
    .top { padding-bottom: 8px; gap: 6px; }
    h1 { font-size: 17px; } h1 small { display: none; }
    .views { gap: 4px; }
    .views button { padding: 6px 9px; font-size: 11px; letter-spacing: .6px; }
    .hint span:last-child { display: none; }
  }
</style>

<script>
(function () {
  "use strict";
  var T = THREE;
  var CEIL = 2150, DATUM = 1000;

  // ---------- plan (mm). x = east, z = south; polygon order gives inward normals ----------
  var P = {
    A: [0, 0], B: [0, -620], C: [910, -1183], D: [847, -1639], E: [2729, -2313], // wall A (D-E) measured 2000 on site
    F: [2878, -1763], G: [2878, 90], I: [2380, 90], J2: [1600, 90], J: [1600, 0]
  };
  var ORDER = ["A", "B", "C", "D", "E", "F", "G", "I", "J2", "J"];
  var DOOR_EDGE = "I-J2";
  var GLASS_X = 915, GLASS_Z0 = -1183, GLASS_Z1 = -583;

  function edge(a, b) {
    var p = P[a], q = P[b], dx = q[0] - p[0], dz = q[1] - p[1], L = Math.hypot(dx, dz);
    dx /= L; dz /= L;
    return { p: p, d: [dx, dz], n: [-dz, dx], L: L, theta: Math.atan2(-dz, dx) };
  }
  function place(obj, e, u, out) {
    obj.position.set(e.p[0] + e.d[0] * u + e.n[0] * out, obj.position.y, e.p[1] + e.d[1] * u + e.n[1] * out);
    obj.rotation.y = e.theta;
    return obj;
  }

  // ---------- renderer ----------
  var stage = document.getElementById("stage");
  var renderer;
  try {
    renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  } catch (e) {
    document.getElementById("err").hidden = false;
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.physicallyCorrectLights = true;
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.8;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFShadowMap; // PCF honours shadow.radius for a softer edge
  stage.appendChild(renderer.domElement);

  var scene = new T.Scene();
  scene.background = new T.Color(0x1a1f1b);
  var pmrem = new T.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new T.RoomEnvironment(), 0.04).texture;

  var root = new T.Group();
  root.scale.setScalar(0.001); // model in mm, world in metres
  scene.add(root);

  // ---------- seeded random ----------
  var seed = 20260926;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  // ---------- textures ----------
  var maxAniso = renderer.capabilities.getMaxAnisotropy();
  function tex(canvas, srgb) {
    var t = new T.CanvasTexture(canvas);
    t.wrapS = t.wrapT = T.RepeatWrapping;
    t.anisotropy = maxAniso;
    if (srgb) t.encoding = T.sRGBEncoding;
    return t;
  }

  // Vertical stack-bond wall tile generator. Each call can set its own tile size; UVs are in mm.
  function makeTile(o) {
    var GW = o.w, GH = o.h, GG = o.g, GCOLS = o.cols, GROWS = o.rows;
    var GMW = GCOLS * (GW + GG), GMH = GROWS * (GH + GG);
    var s = 1.6, w = Math.round(GMW * s), h = Math.round(GMH * s);
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    var b = document.createElement("canvas"); b.width = w; b.height = h;
    var g = c.getContext("2d"), bg = b.getContext("2d");
    var rc = document.createElement("canvas"); rc.width = w; rc.height = h;
    var rgx = rc.getContext("2d"); rgx.fillStyle = "#e6e6e6"; rgx.fillRect(0, 0, w, h);
    g.fillStyle = o.grout; g.fillRect(0, 0, w, h);
    bg.fillStyle = "#5a5a5a"; bg.fillRect(0, 0, w, h);
    var greens = o.palette;
    for (var cx = 0; cx < GCOLS; cx++) {
      for (var ry = 0; ry < GROWS; ry++) {
        var x = (cx * (GW + GG) + GG / 2) * s, y = (ry * (GH + GG) + GG / 2) * s, tw = GW * s, th = GH * s;
        var base = greens[Math.floor(rnd() * greens.length)];
        // glaze pools darker at the edges, lighter through the middle
        var lg = g.createLinearGradient(x, 0, x + tw, 0);
        var dk = function (k) { return "rgb(" + Math.round(base[0] * k) + "," + Math.round(base[1] * k) + "," + Math.round(base[2] * k) + ")"; };
        var ed = o.edge; lg.addColorStop(0, dk(ed)); lg.addColorStop(0.18, dk(0.95)); lg.addColorStop(0.5, dk(1.06)); lg.addColorStop(0.82, dk(0.95)); lg.addColorStop(1, dk(ed - 0.02));
        g.fillStyle = lg; g.fillRect(x, y, tw, th);
        // mottled blooms
        for (var k = 0; k < o.blooms; k++) {
          var bx = x + rnd() * tw, by = y + rnd() * th, br = (12 + rnd() * 30) * s;
          var rg = g.createRadialGradient(bx, by, 0, bx, by, br);
          var light = rnd() > 0.45;
          rg.addColorStop(0, light ? o.bloomLight : o.bloomDark);
          rg.addColorStop(1, "rgba(0,0,0,0)");
          g.fillStyle = rg; g.fillRect(x, y, tw, th);
        }
        // crackle network
        g.save(); g.beginPath(); g.rect(x, y, tw, th); g.clip();
        g.strokeStyle = "rgba(38,46,24,0.28)"; g.lineWidth = 0.6;
        for (k = 0; k < o.cracks; k++) {
          var px = x + rnd() * tw, py = y + rnd() * th;
          g.beginPath(); g.moveTo(px, py);
          for (var m = 0; m < 4; m++) { px += (rnd() - 0.5) * 22 * s; py += (rnd() - 0.5) * 22 * s; g.lineTo(px, py); }
          g.stroke();
        }
        g.restore();
        // bump: raised tile, rounded edge, gentle undulation
        var bgd = bg.createLinearGradient(x, 0, x + tw, 0);
        bgd.addColorStop(0, "#909090"); bgd.addColorStop(0.1, "#c8c8c8"); bgd.addColorStop(0.9, "#c8c8c8"); bgd.addColorStop(1, "#909090");
        bg.fillStyle = bgd; bg.fillRect(x, y, tw, th);
        bg.fillStyle = "rgba(0,0,0,0.35)"; bg.fillRect(x, y, tw, 3 * s); bg.fillRect(x, y + th - 3 * s, tw, 3 * s);
        // each tile sits very slightly out of plane, so reflections break from tile to tile
        var ang = rnd() * Math.PI * 2, amp = 0.08 + rnd() * 0.14, cxm = x + tw / 2, cym = y + th / 2;
        var tg = bg.createLinearGradient(cxm - Math.cos(ang) * tw / 2, cym - Math.sin(ang) * th / 2, cxm + Math.cos(ang) * tw / 2, cym + Math.sin(ang) * th / 2);
        tg.addColorStop(0, "rgba(255,255,255," + amp.toFixed(3) + ")"); tg.addColorStop(1, "rgba(0,0,0," + amp.toFixed(3) + ")");
        bg.fillStyle = tg; bg.fillRect(x + 2 * s, y + 4 * s, tw - 4 * s, th - 8 * s);
        // zellige: hand-made undulating face and the odd dark pinhole in the glaze
        for (var wv = 0; wv < (o.wavy || 0); wv++) {
          var wx2 = x + rnd() * tw, wy2 = y + rnd() * th, wr = (25 + rnd() * 40) * s;
          var wgd = bg.createRadialGradient(wx2, wy2, 0, wx2, wy2, wr);
          wgd.addColorStop(0, rnd() > 0.5 ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.1)"); wgd.addColorStop(1, "rgba(0,0,0,0)");
          bg.fillStyle = wgd; bg.fillRect(x, y, tw, th);
        }
        for (var sp = 0; sp < (o.speckle || 0); sp++) {
          g.fillStyle = "rgba(18,24,20," + (0.3 + rnd() * 0.4).toFixed(2) + ")";
          var sr = (0.4 + rnd() * 1.1) * s; g.beginPath(); g.arc(x + rnd() * tw, y + rnd() * th, sr, 0, Math.PI * 2); g.fill();
        }
        // gloss varies a little per tile; grout stays matte
        var rv = Math.round(o.rough[0] + rnd() * (o.rough[1] - o.rough[0]));
        rgx.fillStyle = "rgb(" + rv + "," + rv + "," + rv + ")"; rgx.fillRect(x, y, tw, th);
      }
    }
    var mp = tex(c, true), bp = tex(b, false), rp = tex(rc, false);
    [mp, bp, rp].forEach(function (t) { t.repeat.set(1 / GMW, 1 / GMH); t.offset.set(0, -DATUM / GMH); });
    return [mp, bp, GMW, GMH, rp];
  }
  // olive gloss feature tile (Beaumont quote): 50 x 150, olive-khaki glaze, Ardex Slate Grey grout
  var gt = makeTile({
    w: 48, h: 148, g: 2, cols: 18, rows: 6, // 50 x 150 pitch, sold on 300 x 300 sheets
    palette: [[86, 86, 64], [80, 82, 60], [94, 91, 64], [78, 80, 58], [98, 93, 66], [82, 84, 62], [102, 97, 70], [84, 84, 60]],
    rough: [18, 52], grout: "#8a8d8f", edge: 0.84, blooms: 6, bloomLight: "rgba(220,214,180,0.1)", bloomDark: "rgba(50,52,34,0.12)", cracks: 0
  });
  var greenMap = gt[0], greenBump = gt[1], GREEN_MW = gt[2], GREEN_MH = gt[3], greenRough = gt[4];
  // Beaumont-style sage: washed olive, khaki and grey-green, soft edges, pale grout, no crackle
  var st = makeTile({
    w: 65, h: 200, g: 2.5, cols: 12, rows: 5,
    palette: [[118, 120, 96], [108, 116, 104], [126, 120, 94], [114, 118, 110], [102, 106, 80], [122, 124, 104], [106, 112, 96], [130, 124, 100], [98, 106, 92]],
    rough: [70, 105], grout: "#cfcbbf", edge: 0.84, blooms: 14, bloomLight: "rgba(214,214,200,0.2)", bloomDark: "rgba(70,78,60,0.24)", cracks: 0
  });
  var sageMap = st[0], sageBump = st[1], SAGE_MW = st[2], SAGE_MH = st[3], sageRough = st[4];
  // Palma Green gloss zellige (TFO #4628): 100 x 100, irregular glossy face, deep grey-greens, light grey grout
  var zt = makeTile({
    w: 97, h: 97, g: 3, cols: 9, rows: 9,
    palette: [[60, 70, 62], [72, 82, 74], [52, 62, 56], [80, 88, 80], [64, 74, 66], [88, 96, 88], [56, 66, 60], [74, 84, 76]],
    rough: [8, 40], grout: "#b7bab4", edge: 0.78, blooms: 12, bloomLight: "rgba(170,186,172,0.16)", bloomDark: "rgba(30,40,34,0.22)", cracks: 0, wavy: 6, speckle: 22

    var leaf = mesh(rbox(e.L - 44, 2020, 40, 4), M.door, true); leaf.position.set(0, 1010, 0); g.add(leaf);
    var frame = M.door;
    var jl = mesh(new T.BoxGeometry(40, 2060, 80), frame); jl.position.set(-e.L / 2 + 10, 1030, 10); g.add(jl);
    var jr = mesh(new T.BoxGeometry(40, 2060, 80), frame); jr.position.set(e.L / 2 - 10, 1030, 10); g.add(jr);
    var hd = mesh(new T.BoxGeometry(e.L, 40, 80), frame); hd.position.set(0, 2040, 10); g.add(hd);
    var ros = mesh(new T.CylinderGeometry(26, 26, 10, 24), M.brass); ros.rotation.x = Math.PI / 2; ros.position.set(e.L / 2 - 90, 1020, 25); g.add(ros);
    var lev = mesh(new T.CylinderGeometry(9, 9, 120, 16), M.brass, true); lev.rotation.z = Math.PI / 2; lev.position.set(e.L / 2 - 140, 1020, 50); g.add(lev);
    robeHook(g, 1700, 20); // second robe hook on the back of the door
    // Lombardy door stop (Rainco BB000067) fixed low on the door near its opening edge; it meets the right-hand wall
    var ds = new T.Group(); ds.position.set(e.L / 2 - 70, 90, 20); g.add(ds);
    var dsBase = mesh(new T.CylinderGeometry(24, 22, 8, 32), M.brass, true); dsBase.rotation.x = Math.PI / 2; dsBase.position.z = 4; ds.add(dsBase);
    var dsBody = mesh(new T.CylinderGeometry(20, 20, 30, 32), M.brass, true); dsBody.rotation.x = Math.PI / 2; dsBody.position.z = 23; ds.add(dsBody);
    var dsRing = mesh(new T.TorusGeometry(20, 4, 10, 32), new T.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.7 }), true); dsRing.position.z = 38; ds.add(dsRing);
    var dsCap = mesh(new T.CylinderGeometry(20, 19, 9, 32), M.brass, true); dsCap.rotation.x = Math.PI / 2; dsCap.position.z = 46; ds.add(dsCap);
  })();

  // ---------- lights ----------
  scene.add(new T.HemisphereLight(0xffe2bf, 0x6b5a46, 0.85));
  // soft bounce from the pale floor and walls, lighting the ceiling gently
  (function () { var f = new T.PointLight(0xffd7a8, 1.5, 0, 2); f.position.set(1.5, 0.9, -0.9); scene.add(f); })();
  function downlight(x, z, cd, shadow) {
    var disc = new T.Mesh(new T.CircleGeometry(45, 32), new T.MeshBasicMaterial({ color: 0xf2dcc0 }));
    disc.rotation.x = Math.PI / 2; disc.position.set(x, CEIL - 2, z); root.add(disc);
    var rim = new T.Mesh(new T.RingGeometry(45, 60, 32), M.brass); rim.rotation.x = Math.PI / 2; rim.position.set(x, CEIL - 3, z); root.add(rim);
    // aimed downwards like a real downlight (wide beam, soft edge), so the ceiling around it isn't blown out
    var l = new T.SpotLight(0xffc98c, cd, 0, Math.PI * 0.42, 0.85, 2);
    l.position.set(x / 1000, (CEIL - 30) / 1000, z / 1000);
    l.target.position.set(x / 1000, 0, z / 1000); scene.add(l.target);
    if (shadow) { l.castShadow = true; l.shadow.mapSize.set(2048, 2048); l.shadow.bias = -0.0015; l.shadow.radius = 9; l.shadow.camera.near = 0.05; }
    scene.add(l);
  }
  downlight(2150, -900, 5.2, true);
  downlight(450, -450, 3.0, true);
  downlight(1850, -150, 2.8, false);
  // LED halo light near the cabinet
  (function () {
    var p = new T.Vector3(); var g = new T.Group(); place(g, WALL_A, 1000, 60); g.position.y = 1575;
    var l = new T.PointLight(0xffbf78, 2.4, 1.6, 2);
    l.position.set(g.position.x / 1000, 1.99, g.position.z / 1000); scene.add(l);
  })();
  // exhaust fan
  (function () {
    var fan = new T.Mesh(new T.CylinderGeometry(110, 110, 8, 40), M.ceiling); fan.position.set(1500, CEIL - 4, -700); root.add(fan);
  })();

  // material colours are authored as sRGB hex
  (function () {
    var seen = new Set();
    scene.traverse(function (o) {
      var ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
      ms.forEach(function (m) { if (!seen.has(m) && m.color && !m.map && !(o instanceof T.Reflector)) { seen.add(m); m.color.convertSRGBToLinear(); } });
    });
  })();

  // ---------- camera & views ----------
  var camera = new T.PerspectiveCamera(68, 1, 0.02, 20);
  var controls = new T.OrbitControls(camera, renderer.domElement);
  controls.enableZoom = false; controls.enablePan = false; controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.rotateSpeed = -0.35;
  var VIEWS = {
    basin:  { pos: [2700, 1600, -1450], look: [600, 1150, -150], fov: 70 },
    door:   { pos: [1720, 1600, -420],  look: [1900, 1200, -2200], fov: 74 },
    shower: { pos: [1500, 1550, -760],  look: [0, 1250, -330], fov: 68 },
    vanity: { pos: [2300, 1650, -250],  look: [1500, 1150, -2000], fov: 64 },
    sink:   { pos: [2526, 1250, -6],  look: [1928, 640, -1586], fov: 58 },
    back:   { pos: [2150, 1560, 40],   look: [1700, 950, -1950], fov: 80 } // wide, from the doorway
  };
  function setView(name) {
    var v = VIEWS[name] || VIEWS.basin;
    var pos = new T.Vector3().fromArray(v.pos).multiplyScalar(0.001);
    var look = new T.Vector3().fromArray(v.look).multiplyScalar(0.001);
    camera.position.copy(pos);
    camera.fov = v.fov; camera.updateProjectionMatrix();
    controls.target.copy(pos).add(look.sub(pos).normalize().multiplyScalar(0.05));
    controls.update();
    document.querySelectorAll("[data-view]").forEach(function (bt) { bt.setAttribute("aria-pressed", String(bt.dataset.view === name)); });
    dirty = true;
  }
  document.querySelectorAll("[data-view]").forEach(function (bt) {
    bt.addEventListener("click", function () { setView(bt.dataset.view); });
  });

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    dirty = true;
  }
  var dirty = true;
  controls.addEventListener("change", function () { dirty = true; });
  window.addEventListener("resize", resize);
  resize();
  function setTile(mode) {
    // split: green above 1000 · full: green everywhere · feature: green only on the vanity wall
    // stone: no green at all · sage: like split, with the Beaumont-style sage tile above 1000
    // shower: olive floor to ceiling inside the shower only, stone-look everywhere else
    // zellige: Palma Green zellige on every wall, floor to ceiling
    // kobe: Kobe Verde marble-look porcelain on every wall, floor to ceiling
    var top = mode === "sage" ? M.sage : mode === "zellige" ? M.zellige : mode === "kobe" ? M.kobe : M.green;
    LOWER.forEach(function (w) { w.mesh.material = mode === "zellige" ? M.zellige : mode === "kobe" ? M.kobe : (mode === "full" || (mode === "feature" && w.feature) || (mode === "shower" && w.shower)) ? M.green : M.stone; });
    UPPER.forEach(function (w) { w.mesh.material = (mode === "split" || mode === "sage" || mode === "full" || mode === "zellige" || mode === "kobe" || (mode === "feature" && w.feature) || (mode === "shower" && w.shower)) ? top : M.stone; });
    NICHE.mesh.material = mode === "sage" ? NICHE.sage : mode === "zellige" ? NICHE.zellige : mode === "kobe" ? NICHE.kobe : (mode === "split" || mode === "full" || mode === "shower") ? NICHE.green : NICHE.stone;
    LEDGE_FRONT.material = mode === "feature" ? M.green : M.stoneFloor;
    document.querySelectorAll("[data-tile]").forEach(function (bt) { bt.setAttribute("aria-pressed", String(bt.dataset.tile === mode)); });
    dirty = true;
  }
  document.querySelectorAll("[data-tile]").forEach(function (bt) {
    bt.addEventListener("click", function () { setTile(bt.dataset.tile); });
  });
  // none: the quoted 590 basin on the wall with an exposed trap
  // walnut / white: that vanity with the round vessel basin and tall mixer instead of the 590 basin
  function setVanity(mode) {
    VANITIES.walnut.visible = mode === "walnut";
    VANITIES.white.visible = mode === "white";
    TRAP.forEach(function (m) { m.visible = mode === "none"; });
    VANITIES.vessel.visible = mode !== "none";
    BASIN_RECT.forEach(function (m) { m.visible = mode === "none"; });
    document.querySelectorAll("[data-vanity]").forEach(function (bt) { bt.setAttribute("aria-pressed", String(bt.dataset.vanity === mode)); });
    dirty = true;
  }
  document.querySelectorAll("[data-vanity]").forEach(function (bt) { bt.addEventListener("click", function () { setVanity(bt.dataset.vanity); }); });
  // deep link: #view[-tiles][-vanity|-white], e.g. #door, #door-full, #sink-split-vanity, #sink-split-white
  var hash = (location.hash || "").replace("#", "").split("-");
  setView(VIEWS[hash[0]] ? hash[0] : "basin");
  setTile(["full", "feature", "stone", "sage", "shower", "zellige", "kobe"].indexOf(hash[1]) >= 0 ? hash[1] : "split");
  setVanity(hash.indexOf("vanity", 1) >= 0 ? "walnut" : hash.indexOf("white", 1) >= 0 ? "white" : "none");

  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    if (dirty) { renderer.render(scene, camera); dirty = false; }
  })();
  (function () {
    var c = document.createElement("canvas"); c.width = c.height = 220;
    var ctx = c.getContext("2d"), img = ctx.createImageData(220, 220);
    for (var i = 0; i < img.data.length; i += 4) { var v = 128 + (rnd() - 0.5) * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    ctx.putImageData(img, 0, 0);
    document.getElementById("grain").style.backgroundImage = "url(" + c.toDataURL() + ")";
  })();
  (function () {
    var bt = document.getElementById("ui-toggle");
    function apply(clean) {
      document.body.classList.toggle("clean", clean);
      bt.textContent = clean ? "Show options" : "Hide options";
      bt.setAttribute("aria-pressed", String(clean));
      try { localStorage.setItem("bathroom-clean", clean ? "1" : "0"); } catch (e) {}
    }
    var saved = false; try { saved = localStorage.getItem("bathroom-clean") === "1"; } catch (e) {}
    apply(saved);
    bt.addEventListener("click", function () { apply(!document.body.classList.contains("clean")); });
  })();
  window.__rendered = true;
})();
</script>
