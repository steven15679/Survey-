<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Barlow+Condensed:wght@500;600&family=Public+Sans:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #111612;
    --ink: #eef0e8;
    --muted: #b3bcb0;

  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Public Sans", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  .top {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px;
    display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between;
    background: linear-gradient(rgba(10, 14, 11, 0.75), rgba(10, 14, 11, 0));
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  #ui-toggle {
    position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); z-index: 5;
    font: 600 13px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 1px; text-transform: uppercase;
    color: var(--chip-on-ink); background: var(--chip-on); border: 0; border-radius: 999px;
    padding: 11px 16px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  #ui-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  body.clean .top, body.clean .hint { display: none; }
  body.clean #ui-toggle { opacity: .75; }
  h1 { font-family: "Gloock", Georgia, serif; font-weight: 400; font-size: 22px; margin: 0; line-height: 1.1; }
  h1 small { display: block; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .views { display: flex; flex-wrap: wrap; gap: 6px; }
  .top .controls { display: grid; gap: 6px; justify-items: end; }
  .views button {
    font: 600 13px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 1px; text-transform: uppercase;
    color: var(--ink); background: var(--chip); border: 1px solid rgba(255, 255, 255, 0.18);
    padding: 9px 12px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(6px);
  }
  .views button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  .views button:focus-visible { outline: 2px solid var(--chip-on); outline-offset: 2px; }
  .views .dim { display: flex; align-items: center; gap: 8px; font: 600 13px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 1px; text-transform: uppercase; color: var(--ink); background: var(--chip); border: 1px solid rgba(255, 255, 255, 0.18); padding: 4px 12px; border-radius: 999px; backdrop-filter: blur(6px); }
  .views .dim input { width: 110px; accent-color: var(--chip-on); }
  .hint {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    font-size: 12px; color: var(--muted); text-shadow: 0 1px 2px #000; pointer-events: none;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .lens { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(24,16,8,0.38) 100%); }
  .grain { position: fixed; inset: 0; pointer-events: none; opacity: 0.09; mix-blend-mode: overlay; background-size: 220px 220px; }
  #err[hidden] { display: none; }
  #err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 600px) {
    .top { padding-bottom: 8px; gap: 6px; }
    h1 { font-size: 17px; } h1 small { display: none; }
    .views { gap: 4px; }
    .views button { padding: 6px 9px; font-size: 11px; letter-spacing: .6px; }
    .hint span:last-child { display: none; }
  }
</style>

<script>

    G: [2878, 90], I: [2380, 90], J2: [1600, 90], J: [1600, 0] // E-G: one diagonal right wall from the vanity-wall corner to the door wall

  function makeTile(o) {

        var ed = o.edge; lg.addColorStop(0, dk(ed)); lg.addColorStop(0.18, dk(0.95)); lg.addColorStop(0.5, dk(1.06)); lg.addColorStop(0.82, dk(0.95)); lg.addColorStop(1, dk(ed - 0.02));

    palette: [[86, 86, 64], [80, 82, 60], [94, 91, 64], [78, 80, 58], [98, 93, 66], [82, 84, 62], [102, 97, 70], [84, 84, 60]],

    // matched to your sample photo: olive-khaki, pale yellow-green and blue-grey tiles mixed, cloudy glaze, dark specks
    palette: [[140, 154, 138], [146, 158, 140], [154, 166, 146], [148, 162, 146], [134, 150, 144], [140, 156, 150], [130, 146, 140], [144, 158, 142]],
    rough: [8, 30], grout: "#d2d4cc", edge: 0.9, blooms: 12, bloomLight: "rgba(222,232,218,0.14)", bloomDark: "rgba(90,104,92,0.12)", cracks: 0, wavy: 4, speckle: 7

    palette: [[140, 154, 138], [146, 158, 140], [154, 166, 146], [148, 162, 146], [134, 150, 144], [140, 156, 150], [130, 146, 140], [144, 158, 142]],

        var jaw = mesh(rbox(12, 50, 45, 4), M.brass, true); jaw.position.set(GLASS_X + dx, y, GLASS_Z0 + 30); root.add(jaw);
      });
    });
    // floor clamps
    [GLASS_Z0 + 120, GLASS_Z1 - 120].forEach(function (z) {
      [-11, 11].forEach(function (dx) {
        var jaw = mesh(rbox(12, 45, 50, 4), M.brass, true); jaw.position.set(GLASS_X + dx, 22, z); root.add(jaw);
      });
      var base = mesh(rbox(40, 8, 55, 2), M.brass, true); base.position.set(GLASS_X, 4, z); root.add(base);
    });
  })();

  // ---------- heated towel poles ----------
  (function () {
    var e = EDGES["J-A"];
    [200, 500].forEach(function (u) {
      var g = fixture(e, u, 0);
      var pole = mesh(new T.CylinderGeometry(16, 16, 1200, 24), M.brass, true); pole.position.set(0, 1000, 60); g.add(pole);
      [16, -16].forEach(function (s) {
        var cap = mesh(new T.SphereGeometry(16, 20, 10), M.brass, true); cap.position.set(0, 1000 + s * 37.5, 60); g.add(cap);
      });
      [500, 1500].forEach(function (y) {
        var so = mesh(new T.CylinderGeometry(12, 12, 60, 16), M.brass, true); so.rotation.x = Math.PI / 2; so.position.set(0, y, 30); g.add(so);
        var fl = mesh(new T.CylinderGeometry(28, 28, 8, 20), M.brass); fl.rotation.x = Math.PI / 2; fl.position.set(0, y, 4); g.add(fl);
      });
    });
  })();

  // ---------- door (existing, charcoal) ----------
  (function () {
    var e = EDGES[DOOR_EDGE];
    var g = fixture(e, e.L / 2, -30);
    var leaf = mesh(rbox(e.L - 44, 2020, 40, 4), M.door, true); leaf.position.set(0, 1010, 0); g.add(leaf);
    var frame = M.door;
    var jl = mesh(new T.BoxGeometry(40, 2060, 80), frame); jl.position.set(-e.L / 2 + 10, 1030, 10); g.add(jl);
    var jr = mesh(new T.BoxGeometry(40, 2060, 80), frame); jr.position.set(e.L / 2 - 10, 1030, 10); g.add(jr);
    var hd = mesh(new T.BoxGeometry(e.L, 40, 80), frame); hd.position.set(0, 2040, 10); g.add(hd);
    var ros = mesh(new T.CylinderGeometry(26, 26, 10, 24), M.brass); ros.rotation.x = Math.PI / 2; ros.position.set(e.L / 2 - 90, 1020, 25); g.add(ros);
    var lev = mesh(new T.CylinderGeometry(9, 9, 120, 16), M.brass, true); lev.rotation.z = Math.PI / 2; lev.position.set(e.L / 2 - 140, 1020, 50); g.add(lev);
    robeHook(g, 1700, 20); // second robe hook on the back of the door
    // Lombardy door stop (Rainco BB000067) fixed low on the door near its opening edge; it meets the right-hand wall
    var ds = new T.Group(); ds.position.set(e.L / 2 - 70, 90, 20); g.add(ds);
    var dsBase = mesh(new T.CylinderGeometry(24, 22, 8, 32), M.brass, true); dsBase.rotation.x = Math.PI / 2; dsBase.position.z = 4; ds.add(dsBase);
    var dsBody = mesh(new T.CylinderGeometry(20, 20, 30, 32), M.brass, true); dsBody.rotation.x = Math.PI / 2; dsBody.position.z = 23; ds.add(dsBody);
    var dsRing = mesh(new T.TorusGeometry(20, 4, 10, 32), new T.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.7 }), true); dsRing.position.z = 38; ds.add(dsRing);
    var dsCap = mesh(new T.CylinderGeometry(20, 19, 9, 32), M.brass, true); dsCap.rotation.x = Math.PI / 2; dsCap.position.z = 46; ds.add(dsCap);
  })();

  // ---------- lights ----------
  var HEMI = new T.HemisphereLight(0xffe2bf, 0x6b5a46, 0.85); scene.add(HEMI);
  // soft bounce from the pale floor and walls, lighting the ceiling gently
  var BOUNCE = new T.PointLight(0xffd7a8, 1.5, 0, 2); BOUNCE.position.set(1.5, 0.9, -0.9); scene.add(BOUNCE);
  var DOWN = [], HALO;
  function downlight(x, z, cd, shadow) {
    var disc = new T.Mesh(new T.CircleGeometry(45, 32), new T.MeshBasicMaterial({ color: 0xf2dcc0 }));
    disc.rotation.x = Math.PI / 2; disc.position.set(x, CEIL - 2, z); root.add(disc);
    var rim = new T.Mesh(new T.RingGeometry(45, 60, 32), M.brass); rim.rotation.x = Math.PI / 2; rim.position.set(x, CEIL - 3, z); root.add(rim);
    // aimed downwards like a real downlight (wide beam, soft edge), so the ceiling around it isn't blown out
    var l = new T.SpotLight(0xffc98c, cd, 0, Math.PI * 0.42, 0.85, 2);
    l.position.set(x / 1000, (CEIL - 30) / 1000, z / 1000);
    l.target.position.set(x / 1000, 0, z / 1000); scene.add(l.target);
    if (shadow) { l.castShadow = true; l.shadow.mapSize.set(2048, 2048); l.shadow.bias = -0.0015; l.shadow.radius = 9; l.shadow.camera.near = 0.05; }
    scene.add(l); DOWN.push({ light: l, disc: disc, base: cd });
  }
  downlight(2150, -900, 5.2, true);
  downlight(450, -450, 3.0, true);
  downlight(1850, -150, 2.8, false);
  // LED halo light near the cabinet
  (function () {
    var p = new T.Vector3(); var g = new T.Group(); place(g, WALL_A, CAB_U, 60); g.position.y = 1575;
    var l = new T.PointLight(0xffbf78, 2.4, 1.6, 2); HALO = l;
    l.position.set(g.position.x / 1000, 1.99, g.position.z / 1000); scene.add(l);
  })();
  // exhaust fan
  (function () {
    var fan = new T.Mesh(new T.CylinderGeometry(110, 110, 8, 40), M.ceiling.clone()); fan.position.set(1500, CEIL - 4, -700); root.add(fan);
  })();

  // material colours are authored as sRGB hex
  (function () {
    var seen = new Set();
    scene.traverse(function (o) {
      var ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
      ms.forEach(function (m) { if (!seen.has(m) && m.color && !m.map && !(o instanceof T.Reflector)) { seen.add(m); m.color.convertSRGBToLinear(); } });
    });
  })();

  // ---------- camera & views ----------
  var camera = new T.PerspectiveCamera(68, 1, 0.02, 20);
  var controls = new T.OrbitControls(camera, renderer.domElement);
  controls.enableZoom = false; controls.enablePan = false; controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.rotateSpeed = -0.35;
  var VIEWS = {
    basin:  { pos: [2700, 1600, -1450], look: [600, 1150, -150], fov: 70 },
    door:   { pos: [1720, 1600, -420],  look: [1900, 1200, -2200], fov: 74 },
    shower: { pos: [1500, 1550, -760],  look: [0, 1250, -330], fov: 68 },
    vanity: { pos: [2300, 1650, -250],  look: [1500, 1150, -2000], fov: 64 },
    sink:   { pos: [2526, 1250, -6],  look: [1928, 640, -1586], fov: 58 },
    back:   { pos: [2150, 1560, 40],   look: [1700, 950, -1950], fov: 80 }, // wide, from the doorway
    window: { pos: [2860, 1720, -2010], look: [700, 950, -380], fov: 88 }, // wide, backed right up to the corner window
    wc:     { pos: [1810, 1150, -284], look: [1300, 640, -1720], fov: 50 } // square on to the toilet and flush plate
  };
  function setView(name) {
    var v = VIEWS[name] || VIEWS.basin;
    var pos = new T.Vector3().fromArray(v.pos).multiplyScalar(0.001);
    var look = new T.Vector3().fromArray(v.look).multiplyScalar(0.001);
    camera.position.copy(pos);
    camera.fov = v.fov; camera.updateProjectionMatrix();
    controls.target.copy(pos).add(look.sub(pos).normalize().multiplyScalar(0.05));
    controls.update();
    document.querySelectorAll("[data-view]").forEach(function (bt) { bt.setAttribute("aria-pressed", String(bt.dataset.view === name)); });
    dirty = true;
  }
  document.querySelectorAll("[data-view]").forEach(function (bt) {
    bt.addEventListener("click", function () { setView(bt.dataset.view); });
  });

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    dirty = true;
  }
  var dirty = true;
  controls.addEventListener("change", function () { dirty = true; });
  window.addEventListener("resize", resize);
  resize();
  function setTile(mode) {
    // split: green above 1000 · full: green everywhere · feature: green only on the vanity wall
    // stone: no green at all · sage: like split, with the Beaumont-style sage tile above 1000
    // shower: olive floor to ceiling inside the shower only, stone-look everywhere else
    // zellige: Palma Green zellige on every wall, floor to ceiling
    // sagefull: Beaumont sage on every wall, floor to ceiling; the bench front under the vanity stays stone
    // celadon: Origin Celadon on every wall, floor to ceiling; bench front stays stone
    // celadonS: Origin Celadon 51 x 161 above the 1000 ledge only, stone below
    // celadonLS: Origin Celadon 65 x 200 above the 1000 ledge only, stone below
    // celadonUnder: the reverse, Origin Celadon 51 x 161 below 1000 on every wall and the bench front, pale slim tile above
    // celadonM: Origin Celadon 51 x 161 above the ledge, celadon-coloured 600 x 600 below on every wall and the bench front
    // celadonB: Origin Celadon 51 x 161 floor to ceiling, vertical, half-tile stagger
    // celadonHB: the same tile horizontal, brick bond
    var top = (mode === "sage" || mode === "sagefull") ? M.sage : mode === "zellige" ? M.zellige : (mode === "celadon" || mode === "celadonS" || mode === "celadonM") ? M.celadon : mode === "celadonH" ? M.celadonH : (mode === "celadonL" || mode === "celadonLS") ? M.celadonL : mode === "celadonB" ? M.celadonB : mode === "celadonHB" ? M.celadonHB : M.green;
    if (mode === "celadonUnder") {
      LOWER.forEach(function (w) { w.mesh.material = M.celadon; });
      UPPER.forEach(function (w) { w.mesh.material = M.paleSlim; });
      NICHE.mesh.material = NICHE.pale;
      LEDGE_FRONT.material = M.celadon;
      document.querySelectorAll("[data-tile]").forEach(function (bt) { bt.setAttribute("aria-pressed", String(bt.dataset.tile === mode)); });
      dirty = true;
      return;
    }
    LOWER.forEach(function (w) { w.mesh.material = mode === "celadonM" ? M.celStone : mode === "zellige" ? M.zellige : mode === "sagefull" ? M.sage : mode === "celadon" ? M.celadon : mode === "celadonH" ? M.celadonH : mode === "celadonL" ? M.celadonL : mode === "celadonB" ? M.celadonB : mode === "celadonHB" ? M.celadonHB : (mode === "full" || (mode === "feature" && w.feature) || (mode === "shower" && w.shower)) ? M.green : M.stone; });
    UPPER.forEach(function (w) { w.mesh.material = (mode === "split" || mode === "sage" || mode === "full" || mode === "zellige" || mode === "sagefull" || mode === "celadon" || mode === "celadonH" || mode === "celadonL" || mode === "celadonS" || mode === "celadonB" || mode === "celadonHB" || mode === "celadonLS" || mode === "celadonM" || (mode === "feature" && w.feature) || (mode === "shower" && w.shower)) ? top : M.stone; });
    NICHE.mesh.material = (mode === "sage" || mode === "sagefull") ? NICHE.sage : mode === "zellige" ? NICHE.zellige : (mode === "celadon" || mode === "celadonS" || mode === "celadonM") ? NICHE.celadon : mode === "celadonH" ? NICHE.celadonH : (mode === "celadonL" || mode === "celadonLS") ? NICHE.celadonL : mode === "celadonB" ? NICHE.celadonB : mode === "celadonHB" ? NICHE.celadonHB : (mode === "split" || mode === "full" || mode === "shower") ? NICHE.green : NICHE.stone;
    LEDGE_FRONT.material = mode === "feature" ? M.green : mode === "celadonM" ? M.celStone : M.stoneFloor;
    document.querySelectorAll("[data-tile]").forEach(function (bt) { bt.setAttribute("aria-pressed", String(bt.dataset.tile === mode)); });
    dirty = true;
  }
  document.querySelectorAll("[data-tile]").forEach(function (bt) {
    bt.addEventListener("click", function () { setTile(bt.dataset.tile); });
  });
  // none: the Omvivo Lilli 550 basin on the wall with an exposed trap
  // walnut / white: that vanity with the round vessel basin and tall mixer instead of the Lilli basin
  function setVanity(mode) {
    VANITIES.walnut.visible = mode === "walnut";
    VANITIES.white.visible = mode === "white";
    TRAP.forEach(function (m) { m.visible = mode === "none"; });
    VANITIES.moon.visible = mode === "moon";
    VANITIES.dwall.visible = mode === "dwall";
    VANITIES.semiped.visible = mode === "semiped";
    VANITIES.vessel.visible = mode === "white";
    BASIN_RECT.forEach(function (m) { m.visible = mode === "none"; });
    document.querySelectorAll("[data-vanity]").forEach(function (bt) { bt.setAttribute("aria-pressed", String(bt.dataset.vanity === mode)); });
    dirty = true;
  }
  document.querySelectorAll("[data-vanity]").forEach(function (bt) { bt.addEventListener("click", function () { setVanity(bt.dataset.vanity); }); });
  // lighting presets: colour temperature of the downlights and the light bouncing round the room,
  // plus a brightness multiplier. warm is the default 2700K; mood switches the downlights off and leaves the mirror glow
  var LIGHTS = {
    warm:    { spot: 0xffc98c, disc: 0xf2dcc0, sky: 0xffe2bf, gnd: 0x6b5a46, hemi: 0.85, bounce: 0xffd7a8, b: 1.5, halo: 2.4, down: 1, exp: 0.8 },
    neutral: { spot: 0xffeedd, disc: 0xf8f2ea, sky: 0xfaf4ec, gnd: 0x67615b, hemi: 0.9, bounce: 0xfff1e4, b: 1.5, halo: 2.4, down: 1, exp: 0.78 },
    day:     { spot: 0xf4f6ff, disc: 0xfafbff, sky: 0xeef2ff, gnd: 0x62625f, hemi: 1.0, bounce: 0xf8f8fa, b: 1.6, halo: 2.4, down: 1.1, exp: 0.76 },
    mood:    { spot: 0xffc98c, disc: 0xd8d2ca, sky: 0xffd9b0, gnd: 0x4a3c2e, hemi: 0.22, bounce: 0xffcf98, b: 0.45, halo: 4.2, down: 0, exp: 0.8 }
  };
  var lightMode = "warm", bright = 1;
  function setLight(mode) {
    var L = LIGHTS[mode]; lightMode = mode;
    DOWN.forEach(function (d) { d.light.color.setHex(L.spot); d.light.intensity = d.base * L.down * bright; d.disc.material.color.setHex(L.down ? L.disc : 0xd8d2ca); });
    HEMI.color.setHex(L.sky); HEMI.groundColor.setHex(L.gnd); HEMI.intensity = L.hemi * bright;
    BOUNCE.color.setHex(L.bounce); BOUNCE.intensity = L.b * bright;
    HALO.intensity = L.halo * (mode === "mood" ? bright : 1);
    renderer.toneMappingExposure = L.exp;
    // the window reads as daylight, except in the evening mirror-glow setting
    WINDOW.glass.emissiveIntensity = mode === "mood" ? 0.06 : 0.5;
    WINDOW.light.intensity = WINDOW.on && mode !== "mood" ? 0.8 * bright : 0;
    document.querySelectorAll("[data-light]").forEach(function (bt) { bt.setAttribute("aria-pressed", String(bt.dataset.light === mode)); });
    dirty = true;
  }
  // floor and lower-wall tile: Kalkstone White as quoted, or Tivoli Beige matt 600 x 600
  // (swaps the floor, lower walls, ledge front and bench top together)
  function setFloor(mode) {
    var map = mode === "beige" ? beigeMap : stoneMap;
    M.stone.map = map; M.stoneFloor.map = map; M.stone.needsUpdate = M.stoneFloor.needsUpdate = true;
    document.querySelectorAll("[data-floor]").forEach(function (bt) { bt.setAttribute("aria-pressed", String(bt.dataset.floor === mode)); });
    dirty = true;
  }
  document.querySelectorAll("[data-floor]").forEach(function (bt) { bt.addEventListener("click", function () { setFloor(bt.dataset.floor); }); });
  // ceiling paint: flat white, or a matt paint matched to the Origin Celadon tile
  var CEIL_COLOURS = { white: 0xf1f0ec, celadon: 0x7d9c8a };
  function setCeiling(mode) {
    M.ceiling.color.setHex(CEIL_COLOURS[mode]);
    document.querySelectorAll("[data-ceiling]").forEach(function (bt) { bt.setAttribute("aria-pressed", String(bt.dataset.ceiling === mode)); });
    dirty = true;
  }
  document.querySelectorAll("[data-ceiling]").forEach(function (bt) { bt.addEventListener("click", function () { setCeiling(bt.dataset.ceiling); }); });
  function setWindow(on) {
    WINDOW.on = on; WINDOW.group.visible = on; WIN_AO.visible = !on;
    WIN_FILL.forEach(function (m) { m.visible = !on; });
    document.querySelectorAll("[data-window]").forEach(function (bt) { bt.setAttribute("aria-pressed", String((bt.dataset.window === "on") === on)); });
    setLight(lightMode);
  }
  document.querySelectorAll("[data-window]").forEach(function (bt) { bt.addEventListener("click", function () { setWindow(bt.dataset.window === "on"); }); });
  document.querySelectorAll("[data-light]").forEach(function (bt) { bt.addEventListener("click", function () { setLight(bt.dataset.light); }); });
  document.getElementById("bright").addEventListener("input", function (e) { bright = e.target.value / 100; setLight(lightMode); });
  // deep link: #view[-tiles][-vanity|-white], e.g. #door, #door-full, #sink-split-vanity, #sink-split-white
  var hash = (location.hash || "").replace("#", "").split("-");
  setView(VIEWS[hash[0]] ? hash[0] : "basin");
  setTile(["full", "feature", "stone", "sage", "shower", "zellige", "sagefull", "celadon", "celadonH", "celadonL", "celadonS", "celadonB", "celadonHB", "celadonLS", "celadonM", "celadonUnder"].indexOf(hash[1]) >= 0 ? hash[1] : "split");
  ["neutral", "day", "mood"].forEach(function (m) { if (hash.indexOf(m, 1) >= 0) setLight(m); });
  setWindow(hash.indexOf("nowin", 1) < 0);
  setCeiling(hash.indexOf("cceil", 1) >= 0 ? "celadon" : "white");
  setFloor(hash.indexOf("beige", 1) >= 0 ? "beige" : "white");
  setVanity(hash.indexOf("vanity", 1) >= 0 ? "walnut" : hash.indexOf("white", 1) >= 0 ? "white" : hash.indexOf("moon", 1) >= 0 ? "moon" : hash.indexOf("dwall", 1) >= 0 ? "dwall" : hash.indexOf("semiped", 1) >= 0 ? "semiped" : "none");

  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    if (dirty) { renderer.render(scene, camera); dirty = false; }
  })();
  (function () {
    var c = document.createElement("canvas"); c.width = c.height = 220;
    var ctx = c.getContext("2d"), img = ctx.createImageData(220, 220);
    for (var i = 0; i < img.data.length; i += 4) { var v = 128 + (rnd() - 0.5) * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    ctx.putImageData(img, 0, 0);
    document.getElementById("grain").style.backgroundImage = "url(" + c.toDataURL() + ")";
  })();
  (function () {
    var bt = document.getElementById("ui-toggle");
    function apply(clean) {
      document.body.classList.toggle("clean", clean);
      bt.textContent = clean ? "Show options" : "Hide options";
      bt.setAttribute("aria-pressed", String(clean));
      try { localStorage.setItem("bathroom-clean", clean ? "1" : "0"); } catch (e) {}
    }
    var saved = false; try { saved = localStorage.getItem("bathroom-clean") === "1"; } catch (e) {}
    apply(saved);
    bt.addEventListener("click", function () { apply(!document.body.classList.contains("clean")); });
  })();
  window.__rendered = true;
})();
</script>
